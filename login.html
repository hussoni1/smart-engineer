<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f5f6fa;
  }
  .login-box {
    background: #fff;
    padding: 40px 32px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    text-align: center;
    width: 320px;
  }
  .login-box h2 {
    margin-bottom: 24px;
    color: #222;
  }
  #google-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 15px;
    color: #333;
    transition: background 0.2s;
  }
  #google-btn:hover { background: #f7f7f7; }
  #google-btn img { width: 20px; height: 20px; }
  #user-info { display: none; margin-top: 20px; }
  #user-info img { width: 60px; border-radius: 50%; margin-bottom: 10px; }
  #logout-btn {
    margin-top: 12px;
    background: none;
    border: none;
    color: #d33;
    cursor: pointer;
    text-decoration: underline;
  }
  #error-msg { color: #d33; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<div class="login-box">
  <h2>تسجيل الدخول</h2>

  <button id="google-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
    تسجيل الدخول عبر جوجل
  </button>

  <div id="user-info">
    <img id="user-photo" src="" alt="صورة المستخدم">
    <p id="user-name"></p>
    <p id="user-email" style="color:#666; font-size:13px;"></p>
    <button id="logout-btn">تسجيل الخروج</button>
  </div>

  <p id="error-msg"></p>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // ⚠️ استبدل هذي القيم بالقيم اللي أخذتها من Firebase Console
  const firebaseConfig = {
    apiKey: "AIzaSyDrOSaFhlKYqAfkxaxd9T0clNN3ASS5gz8",
    authDomain: "h1111-91f2a.firebaseapp.com",
    projectId: "h1111-91f2a",
    storageBucket: "h1111-91f2a.firebasestorage.app",
    messagingSenderId: "673197909170",
    appId: "1:673197909170:web:0c16f65b32777b4ccb95ab",
    measurementId: "G-9TXN8E0QB8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const googleBtn = document.getElementById("google-btn");
  const logoutBtn = document.getElementById("logout-btn");
  const userInfo = document.getElementById("user-info");
  const userPhoto = document.getElementById("user-photo");
  const userName = document.getElementById("user-name");
  const userEmail = document.getElementById("user-email");
  const errorMsg = document.getElementById("error-msg");

  googleBtn.addEventListener("click", () => {
    signInWithPopup(auth, provider)
      .then((result) => {
        // تم تسجيل الدخول بنجاح
        console.log("User:", result.user);
      })
      .catch((error) => {
        errorMsg.textContent = "حدث خطأ أثناء تسجيل الدخول: " + error.message;
        errorMsg.style.display = "block";
      });
  });

  logoutBtn.addEventListener("click", () => {
    signOut(auth);
  });

  // يراقب حالة تسجيل الدخول تلقائياً
  onAuthStateChanged(auth, (user) => {
    if (user) {
      googleBtn.style.display = "none";
      userInfo.style.display = "block";
      userPhoto.src = user.photoURL || "";
      userName.textContent = user.displayName || "";
      userEmail.textContent = user.email || "";

      // هنا تقدر ترسل بيانات المستخدم لباكند خاص فيك لو تحتاج
      // مثلاً: fetch('/api/save-user', { method: 'POST', body: JSON.stringify({ uid: user.uid, email: user.email }) })
    } else {
      googleBtn.style.display = "flex";
      userInfo.style.display = "none";
    }
  });
</script>

</body>
</html>
